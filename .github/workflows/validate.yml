name: Validate public release
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
env:
  AFP_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.9'}
          - {os: ubuntu-24.04, python: '3.12'}
          - {os: macos-latest, python: '3.12'}
          - {os: windows-latest, python: '3.12'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-checks.txt
      - id: tests
        run: python -I -B scripts/run_tests.py --output "${{ runner.temp }}/test-results.json" --log "${{ runner.temp }}/tests-private.log"
      - name: Retain bounded test counts
        if: ${{ always() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-counts-${{ matrix.os }}-py${{ matrix.python }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results.json
          if-no-files-found: ignore
          retention-days: 0 # Inherit existing repository retention; no new 30-day policy.

  release-checks:
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # Inspect reachable commit/tag metadata; no retained-object probe.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-checks.txt
      - name: Install checksum-pinned development scanner
        shell: bash
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Run the same public validator and archive builder
        shell: bash
        run: python -I -B scripts/validate_release.py --gitleaks "$RUNNER_TEMP/gitleaks" --output "$RUNNER_TEMP/agentlogue-validation" --artifacts "$RUNNER_TEMP/agentlogue-artifacts" --ci-export "$RUNNER_TEMP/agentlogue-ci-export"
      - name: Retain reviewed validation evidence or safe failure summary
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-evidence-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agentlogue-ci-export/validation-evidence/*.json
          if-no-files-found: ignore
          retention-days: 0
      - name: Retain validated candidate archives
        if: ${{ success() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-archives-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/agentlogue-ci-export/candidate-archives/agentlogue-v*-github.zip
            ${{ runner.temp }}/agentlogue-ci-export/candidate-archives/agentlogue-v*-skill.zip
            ${{ runner.temp }}/agentlogue-ci-export/candidate-archives/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 0
